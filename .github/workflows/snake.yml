# ============================================================
# 🐍 Contribution Snake Animation Generator
# ============================================================
# This workflow generates an animated SVG snake that "eats"
# your GitHub contribution graph. It commits the output to
# the `output` branch of this repository.
#
# SETUP:
# 1. Copy this file to: TedXpro/TedXpro/.github/workflows/snake.yml
# 2. Push to the main branch
# 3. Go to Actions tab → "Generate Snake Animation" → Run workflow
# 4. The first run will create the `output` branch automatically
# 5. After that, it runs automatically every 6 hours
#
# The README references these output files:
# - https://raw.githubusercontent.com/TedXpro/TedXpro/output/github-snake.svg
# - https://raw.githubusercontent.com/TedXpro/TedXpro/output/github-snake-dark.svg
# ============================================================

name: Generate Snake Animation

on:
  # Run every 6 hours to keep the animation fresh
  schedule:
    - cron: "0 */6 * * *"
  
  # Allow manual trigger from the Actions tab
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Generate Snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: TedXpro
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to output branch
        uses: crazy-max/ghaction-github-pages@v4.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
