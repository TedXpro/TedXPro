# ============================================================
# 🐍 Custom Contribution Snake AI Animation Generator
# ============================================================
# Runs a BFS shortest-path + tail-safety Snake AI over your
# GitHub contribution calendar with true 1:1 tail growth, and
# deploys light/dark SVGs to the `output` branch.
# ============================================================

name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

# Grant write access so the action can push to the output branch
permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate Custom Snake AI SVGs
        run: python scripts/generate_snake.py --user "${{ github.repository_owner }}" --out-dir dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to output branch
        uses: crazy-max/ghaction-github-pages@v4.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
